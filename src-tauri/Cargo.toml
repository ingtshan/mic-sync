[package]
name = "mic-sync"
version = "0.4.0"
description = "Share one physical microphone across multiple Macs over LAN"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.16"
local-ip-address = "0.6"

[profile.release]
strip = true
lto = true
codegen-units = 1
